name: CI

on:
  pull_request:
    branches: [develop, staging, main]
  push:
    branches: [develop, staging, main]

jobs:
  build-lint-typecheck:
    runs-on: ubuntu-latest
    env:
      # This job only builds/typechecks (SQLite, no real DB touched) — these
      # are dummy values so `next build`'s production-mode page-data
      # collection doesn't trip lib/auth.ts's real-secret guard. Never use
      # these for an actual deploy; staging/production set real per-env
      # secrets (see deploy-staging.yml / deploy-production.yml).
      NODE_ENV: production
      JWT_SECRET: ci-build-only-not-a-real-secret
      DATABASE_URL: file:./dev.db
      NEXT_PUBLIC_OWNER_EMAIL: ci@example.com
      CRON_SECRET: ci-build-only-cron-secret-value
      SMTP_HOST: localhost
      SMTP_FROM: ci@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Prepare DB (defaults to SQLite — no DATABASE_URL needed for a build-only check)
        run: node scripts/prepare-db.mjs
      - run: npx prisma generate
      # Non-blocking for now: the existing codebase has ~227 pre-existing
      # lint errors that predate this pipeline (lint was never enforced
      # before). Flip to blocking once that backlog is cleared — see
      # docs/GO-LIVE-RUNBOOK.md. New code should still be written lint-clean.
      - run: npm run lint
        continue-on-error: true
      # Must run after `prisma generate` — the generated client's types
      # (PrismaClient, model types) don't exist until then, which otherwise
      # cascades into unrelated "implicit any" errors across the codebase.
      - run: npm run typecheck
      - run: npm run build

  config-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx tsx scripts/validate-config.ts --env=ci
