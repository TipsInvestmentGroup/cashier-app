name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  approval-gated-deploy:
    runs-on: ubuntu-latest
    # Requesting the "production" Environment is what pauses this job for a
    # required reviewer's approval (configured in GitHub Settings ->
    # Environments -> production -> Deployment protection rules). This is
    # the "never deploy directly to production" gate.
    environment: production
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.PROD_DATABASE_URL_UNPOOLED }}
      JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
      CRON_SECRET: ${{ secrets.PROD_CRON_SECRET }}
      NEXT_PUBLIC_OWNER_EMAIL: ${{ secrets.PROD_OWNER_EMAIL }}
      SMTP_HOST: ${{ secrets.PROD_SMTP_HOST }}
      SMTP_FROM: ${{ secrets.PROD_SMTP_FROM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      # NODE_ENV must NOT be set here (or at job level) — npm ci honors
      # NODE_ENV=production by omitting devDependencies, which would drop
      # `tsx` (a devDependency) and break every npx tsx step below. Set it
      # per-step instead, only where validate-config.ts/the app actually
      # need it.
      - run: npm ci

      - name: Validate configuration
        run: npx tsx scripts/validate-config.ts --env=production
        env:
          NODE_ENV: production

      - name: Apply pending migrations
        run: |
          node scripts/prepare-db.mjs
          npx prisma generate
          npx prisma migrate deploy
        env:
          NODE_ENV: production

      - name: Deploy to Vercel (Production)
        run: |
          # Pinned rather than @latest — see the matching comment in
          # deploy-staging.yml: 57.0.0 reproducibly failed uploads there, and
          # 56.5.0 (its replacement) started failing the same way 4/4 times
          # on 2026-07-29, so both pins moved to 58.1.0 together.
          npm i -g vercel@58.1.0
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"

          # See the matching retry loop + comment in deploy-staging.yml —
          # the upload step has been reproducibly flaky independent of CLI
          # version; `--prebuilt` re-uploads from .vercel/output without
          # rebuilding, so retrying just this command is safe and cheap.
          for attempt in 1 2 3; do
            if vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"; then
              exit 0
            fi
            echo "vercel deploy attempt $attempt failed, retrying in 15s..."
            sleep 15
          done
          echo "vercel deploy failed after 3 attempts"
          exit 1
        env:
          NODE_ENV: production
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Post-deploy smoke check (read-only — runs against live business data)
        run: npx tsx scripts/smoke/run-all.ts --readonly
        env:
          SMOKE_BASE_URL: ${{ secrets.PROD_APP_URL }}
          SMOKE_ADMIN_EMAIL: ${{ secrets.PROD_SMOKE_READONLY_EMAIL }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.PROD_SMOKE_READONLY_PASSWORD }}
          # No-op if production isn't behind Deployment Protection — see the
          # matching comment in deploy-staging.yml.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
