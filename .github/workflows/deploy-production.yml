name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  approval-gated-deploy:
    runs-on: ubuntu-latest
    # Requesting the "production" Environment is what pauses this job for a
    # required reviewer's approval (configured in GitHub Settings ->
    # Environments -> production -> Deployment protection rules). This is
    # the "never deploy directly to production" gate.
    environment: production
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.PROD_DATABASE_URL_UNPOOLED }}
      JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
      CRON_SECRET: ${{ secrets.PROD_CRON_SECRET }}
      NEXT_PUBLIC_OWNER_EMAIL: ${{ secrets.PROD_OWNER_EMAIL }}
      SMTP_HOST: ${{ secrets.PROD_SMTP_HOST }}
      SMTP_FROM: ${{ secrets.PROD_SMTP_FROM }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      # NODE_ENV must NOT be set here (or at job level) — npm ci honors
      # NODE_ENV=production by omitting devDependencies, which would drop
      # `tsx` (a devDependency) and break every npx tsx step below. Set it
      # per-step instead, only where validate-config.ts/the app actually
      # need it.
      - run: npm ci

      - name: Validate configuration
        run: npx tsx scripts/validate-config.ts --env=production
        env:
          NODE_ENV: production

      - name: Apply pending migrations
        run: |
          node scripts/prepare-db.mjs
          npx prisma generate
          npx prisma migrate deploy
        env:
          NODE_ENV: production

      - name: Deploy to Vercel (Production)
        id: deploy
        run: |
          set -euo pipefail
          # Pinned rather than @latest — see the matching comment in
          # deploy-staging.yml: 57.0.0 reproducibly failed uploads there, and
          # 56.5.0 (its replacement) started failing the same way 4/4 times
          # on 2026-07-29, so both pins moved to 58.1.0 together.
          npm i -g vercel@58.1.0

          # Watermark taken BEFORE deploying: nothing created earlier can
          # possibly be this run's output. This is what makes the verification
          # below immune to matching a pre-existing deployment.
          SINCE_MS="$(node -e 'console.log(Date.now())')"
          export SINCE_MS

          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"

          # `vercel deploy`'s exit code is untrusted in BOTH directions:
          #   2026-07-29: non-zero ("Upload aborted") on deploys that DID reach READY.
          #   2026-08-04: non-zero having created NOTHING — a hard account quota,
          #     Error: Too many requests - try again in 24 hours
          #            (more than 5000, code: "api-upload-free")
          #     after Uploading (0.0B/4.4MB).
          # So retry, but ask the API between attempts so the 2026-07-29 false
          # negative doesn't burn more upload quota. --archive=tgz uploads one
          # tarball instead of thousands of files — Vercel's own suggested
          # mitigation for the api-upload-free quota that caused the outage.
          for attempt in 1 2 3; do
            echo "::group::vercel deploy attempt $attempt"
            set +e
            vercel deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN"
            rc=$?
            set -e
            echo "::endgroup::"
            echo "attempt $attempt exited rc=$rc"
            if [ "$rc" -eq 0 ]; then break; fi
            if node scripts/ci/verify-vercel-deploy.mjs --mode=production --exists-only; then
              echo "deployment exists despite rc=$rc (known false negative) — not retrying"
              break
            fi
            if [ "$attempt" -lt 3 ]; then echo "nothing was created; retrying in 20s"; sleep 20; fi
          done

          # The ONLY thing that decides success. Requires a deployment that is
          # source=cli AND target=production AND for THIS commit AND newer than
          # the watermark AND READY AND actually served by the production alias.
          # (The old check tested deployments[0].state alone and so accepted
          # Vercel's git-integration preview of the same commit — see
          # scripts/ci/verify-vercel-deploy.mjs for the full incident writeup.)
          node scripts/ci/verify-vercel-deploy.mjs --mode=production
        env:
          NODE_ENV: production
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT: cashier-app
          PROD_HOST: ${{ secrets.PROD_APP_URL }}

      # Idempotent (create-only-if-absent) — see the matching step + comment
      # in deploy-staging.yml (#72). Missing here until now, which is why
      # newly-added seed defaults (e.g. the Reconciliation Workflow Engine's
      # RolePermission role grants, added 2026-07-20) never backfilled onto
      # production — confirmed by the post-deploy smoke check's
      # `reconciliation` 403 on 2026-07-29.
      - name: Seed database
        run: |
          response=$(curl -s -w "\n%{http_code}" "${{ secrets.PROD_APP_URL }}/api/admin/seed?secret=$CRON_SECRET" \
            -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET")
          status="${response##*$'\n'}"
          body="${response%$'\n'*}"
          echo "$body"
          if [ "$status" -ge 400 ]; then
            echo "Seed request failed with status $status"
            exit 1
          fi
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Post-deploy smoke check (read-only — runs against live business data)
        run: npx tsx scripts/smoke/run-all.ts --readonly
        env:
          SMOKE_BASE_URL: ${{ secrets.PROD_APP_URL }}
          SMOKE_ADMIN_EMAIL: ${{ secrets.PROD_SMOKE_READONLY_EMAIL }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.PROD_SMOKE_READONLY_PASSWORD }}
          # No-op if production isn't behind Deployment Protection — see the
          # matching comment in deploy-staging.yml.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      # Seed + smoke above hit PROD_APP_URL, so they pass whatever the alias
      # happens to serve — during the 2026-08-04 false greens they green-lit the
      # STALE build. Re-assert here that the alias still serves the deployment we
      # verified, so a competing production deploy landing mid-run (e.g. a push
      # to the Vercel production branch) can't leave a green run over stale code.
      - name: Re-assert production alias still serves this commit
        run: |
          set -euo pipefail
          host="${PROD_HOST#http://}"; host="${host#https://}"; host="${host%%/*}"
          if [ -z "$host" ] || [ -z "$EXPECTED" ]; then
            echo "::error::cannot re-assert alias (host or expected deployment id empty)"; exit 1
          fi
          seen=$(curl -sSf -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v4/aliases/$host" \
            | node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8"));console.log((d.deployment&&d.deployment.id)||d.deploymentId||"")')
          if [ "$seen" != "$EXPECTED" ]; then
            echo "::error::Production alias now serves ${seen:-nothing}, expected $EXPECTED — $GITHUB_SHA is NOT live."
            exit 1
          fi
          echo "alias $host still serves $EXPECTED"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROD_HOST: ${{ secrets.PROD_APP_URL }}
          EXPECTED: ${{ steps.deploy.outputs.id }}
